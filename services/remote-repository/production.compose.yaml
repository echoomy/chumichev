name: "remote-repository-production"

services:
  server:
    build:
      context: "./images/"
      dockerfile: "./server.dockerfile"
    ports:
      - "22:22"
      - "8088:8088"
    volumes:
      - "gitlab_configuration:/etc/gitlab/"
      - "gitlab_logs:/var/log/gitlab/"
      - "gitlab_data:/var/opt/gitlab/"
    shm_size: "256m"
    restart: "unless-stopped"

volumes:
  gitlab_configuration:
  gitlab_logs:
  gitlab_data:
