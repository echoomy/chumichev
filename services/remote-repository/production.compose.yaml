name: "remote-repository-production"

services:
  server:
    build:
      context: "./images/"
      dockerfile: "./server.dockerfile"
    ports:
      - "22:22"
      - "8088:80"
    volumes:
      - "gitlab_configuration:/etc/gitlab/"
      - "gitlab_logs:/var/log/gitlab/"
      - "gitlab_data:/var/opt/gitlab/"
    shm_size: "256m"
    restart: "unless-stopped"

  runner:
    build:
      context: "./images/"
      dockerfile: "./runner.dockerfile"
    volumes:
      - "gitlab_runner_configuration:/etc/gitlab-runner/"
      - "gitlab_runner_data:/home/gitlab-runner/"
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: "unless-stopped"

volumes:
  gitlab_runner_configuration:
  gitlab_runner_data:
  gitlab_configuration:
  gitlab_data:
  gitlab_logs:
