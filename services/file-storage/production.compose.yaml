name: "file-storage-production"

services:
  server:
    build:
      context: "./images/"
      dockerfile: "./server.dockerfile"
    ports:
      - "445:445"
    volumes:
      - "samba_data:/storage/"
    environment:
      - "NAME=${REPOSITORY__SHARE_NAME}"
      - "USER=${REPOSITORY__SHARE_USER_NAME}"
      - "PASS=${REPOSITORY__SHARE_USER_PASSWORD}"
    restart: "unless-stopped"

volumes:
  samba_data:
